services:
  # Doris FE (Frontend)
  doris-fe:
    image: apache/doris:fe-4.0.2
    container_name: doris-fe
    hostname: doris-fe
    networks:
      app-network:
        ipv4_address: 172.20.81.2
    ports:
      - "8030:8030"  # HTTP 端口
      - "9030:9030"  # MySQL 协议端口
    environment:
      - FE_SERVERS=doris-fe:172.20.81.2:9010
      - FE_ID=1
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/bootstrap"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Doris BE (Backend)
  doris-be:
    image: apache/doris:be-4.0.2
    container_name: doris-be
    hostname: doris-be
    networks:
      app-network:
        ipv4_address: 172.20.81.3
    ports:
      - "8040:8040"  # HTTP 端口
    environment:
      - FE_SERVERS=doris-fe:172.20.81.2:9010
      - BE_ADDR=172.20.81.3:9050
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - doris-be-log:/opt/apache-doris/be/log
    depends_on:
      doris-fe:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8040/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flu-monitoring-backend
    networks:
      - app-network
    ports:
      - "8000:8000"
    environment:
      - DORIS_HOST=doris-fe
      - DORIS_PORT=9030
      - DORIS_USER=root
      - DORIS_PASSWORD=
      - DORIS_DATABASE=flu_monitoring
      - FLASK_ENV=production
      - FLASK_APP=app.py
    volumes:
      - backend-avatars:/app/avatars
      - backend-documents:/app/documents
      - backend-chroma:/app/chroma_db
    depends_on:
      doris-fe:
        condition: service_healthy
      doris-be:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production  # 使用生产阶段
    container_name: flu-monitoring-frontend
    networks:
      - app-network
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.81.0/24

volumes:
  doris-fe-meta:
    driver: local
  doris-fe-log:
    driver: local
  doris-be-storage:
    driver: local
  doris-be-log:
    driver: local
  backend-avatars:
    driver: local
  backend-documents:
    driver: local
  backend-chroma:
    driver: local
